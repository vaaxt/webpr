{% extends 'events/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Event list</h2>
        <a class="btn btn-primary" href="{% url 'events:event_create' %}">Create event</a>
    </div>

    <div class="row g-4">
        {% for event in events %}
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    {% if event.poster %}
                        <img src="{{ event.poster.url }}" class="card-img-top" alt="{{ event.title }}" style="height: 220px; object-fit: cover;">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ event.title }}</h5>
                        <p class="card-text">{{ event.summary }}</p>
                        <div class="d-flex gap-2 mt-3">
                            <a href="{% url 'events:event_detail' event.pk %}" class="btn btn-outline-primary btn-sm">Detail</a>
                            <a href="{% url 'events:event_update' event.pk %}" class="btn btn-outline-warning btn-sm">Update</a>
                            <a href="{% url 'events:event_delete' event.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info">No events yet.</div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
